version: 2

project_name: ado-dash

before:
  hooks:
    - go mod tidy

builds:
  - id: ado-dash
    main: ./cmd/ado-dash
    binary: ado-dash
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: ado-dash
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

release:
  github:
    owner: ujjwalgoyal19
    name: ado-dash

homebrew_casks:
  - name: ado-dash
    repository:
      owner: ujjwalgoyal19
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ujjwalgoyal19/ado-dash"
    description: "Terminal dashboard for Azure DevOps"
